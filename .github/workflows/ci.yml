name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check generated SEO pages and routes
        run: |
          npm run build:seo
          git diff --exit-code -- editions sitemap.xml _redirects about.html
          test -z "$(git ls-files --others --exclude-standard editions/)"
      - name: Run lint and tests
        run: npm run test:all
